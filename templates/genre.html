<!DOCTYPE html>
<html>
<head>
    <title>{{ genre.name }} Books</title>
</head>
<body>
    <h1>{{ genre.name }} Books</h1>
    <a href="{{ url_for('index') }}">Back to Home</a>
    <ul>
        {% for book in books %}
            <li>
                <h3>{{ book.title }}</h3>
                <p>Author: {{ book.author }}</p>
                <small>Added: {{ book.created_at.strftime('%Y-%m-%d %H:%M') }}</small>
            </li>
        {% endfor %}
    </ul>
</body>
</html>
