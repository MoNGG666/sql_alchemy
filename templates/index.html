<!DOCTYPE html>
<html>
<head>
    <title>Book Library</title>
</head>
<body>
    <h1>Latest Books</h1>
    <ul>
        {% for book in books %}
            <li>
                <h3>{{ book.title }}</h3>
                <p>Author: {{ book.author }}</p>
                <p>Genre: <a href="{{ url_for('genre_page', genre_id=book.genre_id) }}">
                    {{ book.genre.name }}
                </a></p>
                <small>Added: {{ book.created_at.strftime('%Y-%m-%d %H:%M') }}</small>
            </li>
        {% endfor %}
    </ul>
</body>
</html>
